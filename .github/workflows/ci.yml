name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Vitest Suite (Unit & Determinism Replay)
        run: npm test

      - name: Run Headless Sim Balance Check
        run: npm run sim 25

      - name: Verify Generated Backdrop Assets
        run: |
          npm run art:build
          git diff --exit-code -- public/atlas

      - name: Render Scene Preview (art pipeline smoke test)
        run: npm run art:preview

      - name: Build Production Bundle
        run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Build Production Bundle
        run: npm run build

      # Drives the real bundle with real key events: verifies the canvas mounts,
      # that a mid-match hotkey changes the speed chip, and that presses typed
      # during scene boot are replayed instead of dropped.
      - name: Browser E2E (real input cycle)
        run: npm run test:e2e
